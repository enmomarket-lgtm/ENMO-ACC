<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات ENMO</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#F3F5F4; --ink:#0F0F0F; --muted:#6B6B6B; --line:#E3E7E5;
  --green:#2BB673; --green-ink:#1E8C57; --green-soft:#E9F7F0; --red:#C8463F; --red-soft:#FBECEB;
  --on-green:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --surface:#1A1C1B; --ink:#F3F5F4; --muted:#A3A8A6; --line:#2A2D2C;
    --green:#2BB673; --green-ink:#4FD08F; --green-soft:#12261B; --red:#F07A72; --red-soft:#2A1514;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#1A1C1B; --ink:#F3F5F4; --muted:#A3A8A6; --line:#2A2D2C;
  --green:#2BB673; --green-ink:#4FD08F; --green-soft:#12261B; --red:#F07A72; --red-soft:#2A1514;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{height:20px;width:auto;display:block}
.logo.dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.light{display:none}:root:not([data-theme="light"]) .logo.dark{display:block}}
:root[data-theme="dark"] .logo.light{display:none}:root[data-theme="dark"] .logo.dark{display:block}
.brand{display:flex;align-items:center;gap:10px}
.brand span{font-size:14px;color:var(--muted)}
select,input,button{font:inherit;color:inherit}
.usd{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.icon-btn:disabled{opacity:.35;cursor:default}
.mrow{cursor:pointer}
.mrow:hover{background:var(--surface)}
.mrow b{white-space:nowrap}
.list li.mrow{grid-template-columns:1fr auto auto auto;gap:14px;padding:12px 8px;border-radius:8px}
.list li.mhead{grid-template-columns:1fr auto auto auto;gap:14px;padding:6px 8px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.mrow .amt,.mhead span{min-width:86px;text-align:left}
.mhead span:first-child{text-align:right;min-width:0}
.amt.net{color:var(--ink)} .amt.net.neg{color:var(--red)}
@media (max-width:480px){.mrow .amt,.mhead span{min-width:70px;font-size:14px}}

.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month h1{font-size:22px;margin:0;font-weight:700}
.nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;font-size:18px}
.icon-btn:hover{background:var(--surface)}

.summary{position:relative;background:var(--surface);border-radius:16px;padding:22px 22px 18px;overflow:hidden;margin-bottom:22px}
.summary::before{content:"";position:absolute;top:0;left:0;width:44px;height:44px;background:var(--green);border-bottom-right-radius:14px}
.net-label{font-size:14px;color:var(--muted);margin:0}
.net{font-size:44px;font-weight:700;line-height:1.15;margin:4px 0 16px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.net.neg{color:var(--red)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:var(--bg);border-radius:12px;padding:10px 14px}
.split small{display:block;font-size:13px;color:var(--muted)}
.split b{font-size:19px;font-variant-numeric:tabular-nums;direction:ltr;display:block;text-align:right}
.in b{color:var(--green-ink)} .out b{color:var(--red)}

form{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:26px}
form h2,.list h2{font-size:17px;margin:0 0 14px}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:14px}
.toggle label{position:relative;text-align:center;padding:9px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.toggle input{position:absolute;opacity:0;inset:0;cursor:pointer}
.toggle label:has(input:checked){background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toggle label:has(input[value="in"]:checked){color:var(--green-ink)}
.toggle label:has(input[value="out"]:checked){color:var(--red)}
.toggle label:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field span{font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:46px;text-align:right}
.field input[type="date"]::-webkit-date-and-time-value{text-align:right}
.field input.amount{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.save{margin-top:16px;width:100%;border:0;border-radius:12px;padding:13px;background:var(--green);color:var(--on-green);font-weight:700;font-size:17px;cursor:pointer}
.save:hover{filter:brightness(.95)}
.save:focus-visible,.icon-btn:focus-visible,.del:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.save:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;font-size:14px;margin:10px 0 0;color:var(--muted)}
.msg.err{color:var(--red)}

.list ul{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--red)}
.dot.in{background:var(--green)}
.what b{display:block;font-weight:700;font-size:15px}
.what small{color:var(--muted);font-size:13px}
.amt{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.amt.in{color:var(--green-ink)} .amt.out{color:var(--red)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;width:32px;height:32px;border-radius:8px}
.del:hover{background:var(--red-soft);color:var(--red)}
.list li:not(.mrow):not(.mhead):not(.empty){grid-template-columns:auto 1fr auto auto auto}
.edit{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;width:32px;height:32px;border-radius:8px}
.edit:hover{background:var(--green-soft);color:var(--green-ink)}
.edit:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.list li.editing{background:var(--green-soft)}
form.is-editing{border-color:var(--green);border-width:2px}
.cancel{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--bg);font-weight:700;cursor:pointer;display:none}
form.is-editing .cancel{display:block}
.empty{background:var(--surface);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:18px;text-align:center}
@media (max-width:480px){.net{font-size:36px}.grid{grid-template-columns:1fr}.field.half-m{grid-column:auto}}
@media (prefers-reduced-motion:no-preference){.list li.new{animation:flash 1.2s ease-out}}
@keyframes flash{from{background:var(--green-soft)}to{background:transparent}}
.tools{margin-top:28px}
.tools h2{font-size:17px;margin:0 0 12px}
.tool-row{display:flex;flex-wrap:wrap;gap:10px}
.tool{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.tool:hover{background:var(--surface)}
.tool:focus-visible,.tool:focus-within{outline:2px solid var(--green);outline-offset:2px}
</style>

<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;padding:20px">
  <div style="text-align:center;max-width:320px">
    <p style="font-size:18px;font-weight:700;margin:0 0 16px">أدخل رمز الدخول</p>
    <input id="gateCode" type="password" inputmode="numeric" placeholder="••••" style="font-size:24px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--surface);color:var(--ink)">
    <button id="gateBtn" style="margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:16px;cursor:pointer">دخول</button>
    <p id="gateMsg" style="color:var(--red);font-size:14px;min-height:20px;margin:10px 0 0"></p>
  </div>
</div>
<div class="wrap">

      <button type="button" class="tool" id="btnJson">تنزيل نسخة احتياطية</button>
      <label class="tool">استعادة من نسخة<input type="file" id="fileJson" accept=".json,application/json" hidden></label>
    </div>
  </section>
  <p class="note" id="storeNote"></p>
</div>

<script type="module">
const CODE = "1234"; // ← غيّر الرمز من هنا
(function(){
  if (sessionStorage.getItem("gate-ok") === "1") { document.getElementById("gate").remove(); return; }
  const btn = document.getElementById("gateBtn");
  const inp = document.getElementById("gateCode");
  const msg = document.getElementById("gateMsg");
  const tryLogin = () => {
    if (inp.value === CODE) { sessionStorage.setItem("gate-ok","1"); document.getElementById("gate").remove(); }
    else { msg.textContent = "الرمز خطأ"; inp.value = ""; inp.focus(); }
  };
  btn.onclick = tryLogin;
  inp.onkeydown = (e) => { if (e.key === "Enter") tryLogin(); };
  inp.focus();
})();const CATS = {
  in: ["مشروع لعميل","اشتراك شهري","استشارة","أخرى"],
  out: ["رواتب","إيجار","برامج واشتراكات","إعلانات","مواصلات","ضيافة ومكتب","أخرى"],
};
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const $ = (id) => document.getElementById(id);
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const cur = "$", START = "2026-06", MIN = new Date(2026, 5, 1);
let entries = [], view = new Date(), lastAdded = null, mode = "month";
view = new Date(view.getFullYear(), view.getMonth(), 1);
if (view < MIN) view = new Date(MIN);

import { initializeApp } from 'firebase/app';
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot } from 'firebase/firestore';

const firebaseConfig = {
  apiKey: "AIzaSyCohEB-7XLmKDLCPX2m3qKPa4eVf04uFs0",
  authDomain: "enmo-acc.firebaseapp.com",
  projectId: "enmo-acc",
  storageBucket: "enmo-acc.firebasestorage.app",
  messagingSenderId: "499164387013",
  appId: "1:499164387013:web:ba5ceec83ea76255b842ac"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "entries");

onSnapshot(colRef, (snapshot) => {
  entries = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
  $("storeNote").textContent = "محفوظ ومزامَن تلقائياً مع قاعدة بيانات Firestore السحابية.";
});

const store = {
  async add(e) {
    const docRef = await addDoc(colRef, e);
    return docRef.id;
  },
  async remove(id) {
    await deleteDoc(doc(db, "entries", id));
  },
  async update(id, p) {
    await updateDoc(doc(db, "entries", id), p);
  }
};


// ---------- backup: export / import ----------
function download(name, text, type){
  const blob = new Blob([text], { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function stampName(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function exportCSV(){
  const rows = entries.slice().sort((a,b) => a.date.localeCompare(b.date));
  const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["التاريخ","النوع","البند","البيان","المبلغ (USD)"].map(q).join(",")]
    .concat(rows.map(e => [e.date, e.type === "in" ? "مدخول" : "مصروف", e.cat, e.desc].map(q).concat((e.type === "in" ? 1 : -1) * e.amount).join(",")));
  download("enmo-accounts-" + stampName() + ".csv", "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
function exportJSON(){ download("enmo-backup-" + stampName() + ".json", JSON.stringify({ app: "enmo-accounts", version: 1, entries }, null, 2), "application/json"); }
async function importJSON(file){
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result); const list = Array.isArray(data) ? data : data.entries;
      if (!Array.isArray(list)) throw 0;
      const ok = list.filter(e => e && (e.type === "in" || e.type === "out") && +e.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
        .map(e => ({ type: e.type, amount: +e.amount, date: e.date, cat: String(e.cat || "أخرى"), desc: String(e.desc || ""), createdAt: +e.createdAt || 0 }));
      if (!confirm("سيتم إضافة " + ok.length + " حركة إلى قاعدة البيانات. متابعة؟")) return;
      for (const e of ok) { await addDoc(colRef, e); }
      flash("تمت استعادة " + ok.length + " حركة.");
    } catch { flash("الملف غير صالح. اختر ملف نسخة احتياطية من هذا النظام.", true); }
  };
  r.readAsText(file);
}

// ---------- UI ----------
function fmt(n){ return Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money(n, sign){ return (sign || "") + cur + fmt(Math.abs(n)); }
function fillCats(){
  const t = document.querySelector('input[name="type"]:checked').value;
  $("cat").innerHTML = CATS[t].map(c => `<option>${c}</option>`).join("");
}
function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function totals(rows){ let a = 0, b = 0; rows.forEach(e => e.type === "in" ? a += +e.amount : b += +e.amount); return [a, b]; }
function setSummary(label, tin, tout){
  const net = tin - tout;
  $("netLabel").textContent = label;
  $("sumIn").textContent = money(tin);
  $("sumOut").textContent = money(tout);
  $("net").textContent = money(net, net < 0 ? "−" : "");
  $("net").classList.toggle("neg", net < 0);
}
function render(){
  $("tabMonth").setAttribute("aria-pressed", mode === "month");
  $("tabAll").setAttribute("aria-pressed", mode === "all");
  $("prev").disabled = view <= MIN;
  $("prev").style.visibility = $("next").style.visibility = mode === "all" ? "hidden" : "visible";
  const valid = entries.filter(e => (e.date || "") >= START);
  const ul = $("items"); ul.innerHTML = "";
  if (mode === "all") {
    $("monthTitle").textContent = "كل الشهور";
    const [tin, tout] = totals(valid);
    setSummary("الصافي منذ يونيو 2026", tin, tout);
    $("listTitle").textContent = "حسب الشهر";
    const now = new Date(); let end = new Date(now.getFullYear(), now.getMonth(), 1);
    valid.forEach(e => { const d = new Date(e.date + "T00:00"); const m = new Date(d.getFullYear(), d.getMonth(), 1); if (m > end) end = m; });
    const head = document.createElement("li"); head.className = "mhead";
    head.innerHTML = "<span>الشهر</span><span>المدخول</span><span>المصروف</span><span>الصافي</span>"; ul.appendChild(head);
    const months = []; for (let m = new Date(MIN); m <= end; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) months.push(m);
    months.reverse().forEach(m => {
      const [a, b] = totals(valid.filter(e => e.date.startsWith(monthKey(m)))); const n = a - b;
      const li = document.createElement("li"); li.className = "mrow"; li.tabIndex = 0; li.setAttribute("role", "button");
      li.innerHTML = `<div class="what"><b></b></div><span class="amt in"></span><span class="amt out"></span><span class="amt net"></span>`;
      li.querySelector("b").textContent = MONTHS[m.getMonth()] + " " + m.getFullYear();
      li.querySelector(".in").textContent = money(a);
      li.querySelector(".out").textContent = money(b);
      const ne = li.querySelector(".net"); ne.textContent = money(n, n < 0 ? "−" : ""); ne.classList.toggle("neg", n < 0);
      const open = () => { mode = "month"; view = m; render(); window.scrollTo({ top: 0 }); };
      li.onclick = open; li.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } };
      ul.appendChild(li);
    });
    return;
  }
  const key = monthKey(view);
  $("monthTitle").textContent = MONTHS[view.getMonth()] + " " + view.getFullYear();
  const rows = valid.filter(e => e.date.startsWith(key))
    .sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0) - (a.createdAt||0));
  const [tin, tout] = totals(rows);
  setSummary("الصافي هذا الشهر", tin, tout);
  $("listTitle").textContent = rows.length ? `حركات الشهر (${rows.length})` : "حركات الشهر";
  if (!rows.length) { ul.innerHTML = `<li class="empty" style="display:block;border:0">لا توجد حركات في هذا الشهر بعد. سجّل أول مدخول أو مصروف من النموذج أعلاه.</li>`; return; }
  rows.forEach(e => {
    const li = document.createElement("li");
    if (e.id === lastAdded) li.className = "new";
    if (e.id === editingId) li.className = "editing";
    const d = new Date(e.date + "T00:00");
    li.innerHTML = `<i class="dot ${e.type}"></i>
      <div class="what"><b></b><small></small></div>
      <span class="amt ${e.type}"></span>
      <button class="edit" aria-label="عدّل الحركة" title="عدّل">✎</button>
      <button class="del" aria-label="احذف الحركة" title="احذف">×</button>`;
    li.querySelector(".edit").onclick = () => startEdit(e);
    li.querySelector("b").textContent = e.desc || e.cat;
    li.querySelector("small").textContent = (e.desc ? e.cat + "، " : "") + d.getDate() + " " + MONTHS[d.getMonth()];
    li.querySelector(".amt").textContent = money(e.amount, e.type === "in" ? "+" : "−");
    li.querySelector(".del").onclick = async () => {
      if (!confirm("هل تريد حذف هذه الحركة؟")) return;
      try { await store.remove(e.id); } catch { flash("لم يتم الحذف. حاول مرة أخرى.", true); }
    };
    ul.appendChild(li);
  });
}
function flash(t, err){ const m = $("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); }
let editingId = null;
function startEdit(e){
  editingId = e.id;
  document.querySelector(`input[name="type"][value="${e.type}"]`).checked = true; fillCats();
  if (![...$("cat").options].some(o => o.value === e.cat)) $("cat").insertAdjacentHTML("beforeend", "<option></option>"), $("cat").lastElementChild.textContent = e.cat;
  $("cat").value = e.cat; $("amount").value = e.amount; $("date").value = e.date; $("desc").value = e.desc || "";
  $("formTitle").textContent = "عدّل الحركة"; $("save").textContent = "احفظ التعديل"; $("form").classList.add("is-editing");
  flash(""); render(); $("form").scrollIntoView({ block: "start" }); $("amount").focus();
}
function stopEdit(){
  editingId = null; $("formTitle").textContent = "سجّل حركة"; $("save").textContent = "سجّل"; $("form").classList.remove("is-editing");
  $("amount").value = ""; $("desc").value = ""; $("date").value = today(); render();
}
$("cancel").onclick = () => { stopEdit(); flash(""); };

document.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener("change", fillCats));
$("tabMonth").onclick = () => { mode = "month"; render(); };
$("tabAll").onclick = () => { mode = "all"; render(); };
$("prev").onclick = () => { if (view <= MIN) return; view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); };
$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const raw = $("amount").value.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,،\s]/g, "").replace("٫", ".");
  const amount = parseFloat(raw);
  if (!(amount > 0)) { flash("اكتب مبلغاً أكبر من صفر.", true); $("amount").focus(); return; }
  const date = $("date").value || today();
  if (date < START + "-01") { flash("النظام يبدأ من يونيو 2026. اختر تاريخاً من يونيو أو بعده.", true); $("date").focus(); return; }
  const type = document.querySelector('input[name="type"]:checked').value;
  const e = { type, amount: Math.round(amount*100)/100, date, cat: $("cat").value, desc: $("desc").value.trim(), createdAt: Date.now() };
  $("save").disabled = true;
  if (editingId) {
    try {
      const id = editingId; delete e.createdAt;
      await store.update(id, e); lastAdded = id;
      const d = new Date(date + "T00:00"); mode = "month"; view = new Date(d.getFullYear(), d.getMonth(), 1);
      stopEdit(); flash("تم حفظ التعديل: " + money(e.amount) + ".");
    } catch { flash("لم يُحفظ التعديل. تحقق من الاتصال وحاول مرة أخرى.", true); }
    $("save").disabled = false; return;
  }
  try {
    lastAdded = await store.add(e);
    const d = new Date(date + "T00:00"); if (mode === "month") view = new Date(d.getFullYear(), d.getMonth(), 1);
    flash((type === "in" ? "سُجّل مدخول " : "سُجّل مصروف ") + money(e.amount) + ".");
    $("amount").value = ""; $("desc").value = ""; $("amount").focus(); render();
  } catch { flash("لم يتم التسجيل. تحقق من الاتصال وحاول مرة أخرى.", true); }
  $("save").disabled = false;
};
$("btnCsv").onclick = exportCSV; $("btnJson").onclick = exportJSON;
$("fileJson").onchange = (ev) => { const f = ev.target.files[0]; if (f) importJSON(f); ev.target.value = ""; };
$("date").value = today(); $("date").min = START + "-01"; fillCats(); render();
</script>
</body>
</html>
